function drawMap(){
  const c=$('wm'),g=c.getContext('2d'),w=c.width,h=c.height,X=lon=>(lon+180)/360*w,Y=lat=>(90-lat)/180*h;
  g.fillStyle='#0f2338';g.fillRect(0,0,w,h);
  for(let i=0;i<24;i++){g.fillStyle=i%2?'#14304a':'#112a42';g.fillRect(i*w/24,0,w/24,h);}
  g.strokeStyle='#ffffff14';g.lineWidth=1;for(let lat=-60;lat<=60;lat+=30){g.beginPath();g.moveTo(0,Y(lat));g.lineTo(w,Y(lat));g.stroke();}
  g.fillStyle='#7f98ad';g.font='10px system-ui';g.textAlign='center';for(let i=-12;i<=12;i+=3)g.fillText((i>0?'+':i<0?'−':'')+Math.abs(i),X(i*15),12);
  const[a,b]=curCities(),R=a===b?null:1;
  CITIES.forEach(ci=>{g.fillStyle='#e6a23c66';g.beginPath();g.arc(X(ci.lon),Y(ci.lat),2,0,7);g.fill();});
  if(R){g.strokeStyle='#f2bd62';g.lineWidth=2;g.setLineDash([6,5]);g.beginPath();g.moveTo(X(a.lon),Y(a.lat));g.lineTo(X(b.lon),Y(b.lat));g.stroke();g.setLineDash([]);}
  [[a,'#4fd18b'],[b,'#ff6b5a']].forEach(([ci,col])=>{g.fillStyle=col;g.beginPath();g.arc(X(ci.lon),Y(ci.lat),6,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();});
  if(R&&mode==='del'&&(phase==='race'||phase==='count')&&trip.target>0){const p=clamp(trip.km/trip.target,0,1);g.font='16px system-ui';g.fillStyle='#fff';g.fillText('🚛',X(a.lon+(b.lon-a.lon)*p),Y(a.lat+(b.lat-a.lat)*p)+5);}
  updateTzInfo();
}

const NET_KEY='trk2room';
const net={on:false,code:'',id:null,players:{},timer:null,off:0,lastGo:0,joinedAt:0,tick:0,ref:null,me:null,conn:null};
function netStatus(s){$('netStatus').textContent=s;}
function srvNow(){return Date.now()+net.off;}
function payload(){return{n:clean($('name').value.trim(),14)||'Driver',d:Math.round(me.d*10)/10,x:Math.round(me.x*100)/100,c:$('color').value,f:me.fin};}
function sane(d){return{n:clean(d.n,14)||'?',d:Number(d.d)||0,x:clamp(Number(d.x)||1.5,0,3),c:/^#[0-9a-f]{6}$/i.test(d.c)?d.c:'#e6a23c',f:d.f==null?null:Number(d.f),ts:Date.now()};}
function remember(){try{localStorage.setItem(NET_KEY,JSON.stringify({code:net.code,ts:Date.now()}));}catch(e){}}

function randCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function netSend(){if(!net.me)return;try{net.me.set(Object.assign(payload(),{t:firebase.database.ServerValue.TIMESTAMP})).catch(()=>{});}catch(e){}}
function netDetach(){
  if(net.timer)clearInterval(net.timer);net.timer=null;

  netDetach();try{if(me0)me0.remove();if(ref&&alone)ref.remove();}catch(e){}
  Object.assign(net,{on:false,code:'',players:{},me:null,ref:null,conn:null});forget();roomUi(false);netStatus(msg||'');

function startRoom(code,ref){
  netDetach();Object.assign(net,{ref:ref,code:code,id:'p'+Math.random().toString(36).slice(2,9),players:{},on:true});
  net.me=ref.child('players/'+net.id);net.joinedAt=srvNow();
  ref.child('players').on('value',s=>{const v=s.val()||{},o={};for(const k in v)o[k]=sane(v[k]);net.players=o;});
  ref.child('go').on('value',s=>{const g=s.val();if(!g||!g.t||g.t===net.lastGo)return;if(g.t>net.joinedAt&&phase!=='race'&&phase!=='count'){net.lastGo=g.t;if(mode!=='race')setMode('race');beginCountdown(Number(g.s)|0);}});

  roomUi(true);remember();

/* how: 'create' | 'join' | 'resume' */
function netEnter(code,how){

  const ref=fbDb.ref('rooms/'+code),back=()=>{$('createBtn').disabled=false;$('joinBtn').disabled=false;};

function beginCountdown(s){
  seed=s|0;me.name=clean($('name').value.trim(),14)||'Driver';me.color=$('color').value;
  spdLog.length=0;me.pen=0;me.d=0;me.x=1.5;me.v=0;me.crash=0;me.inv=0;me.fin=null;dnfT=0;raceTime=0;collected.clear();weather='sun';wTimer=0;
  if(mode==='del'){const[a,b]=curCities();trip.from=a;trip.to=b;trip.target=roadKm(a,b);trip.km=0;trip.crashes=0;trip.cargo=CARGO[+$('selCargo').value||0];trip.startMs=Date.now();trip.simMs=0;if(me.fuel<=0||me.fuel>100)me.fuel=100;}
  else me.fuel=100;
  turbo.t=0;turbo.cd=0;phase='count';countT=3.5;$('ov').hidden=true;try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
}
function pressStart(){
  if(phase==='count'||phase==='race')return;
  if(mode==='world'){worldStart();return;}

function finishRun(ok){
  phase='done';me.v=0;
  if(!ok){$('ovT').textContent=t('noT');$('ovP').textContent=t('noP');}
  else if(mode==='del'){
    const c=trip.cargo;let r=(50+trip.target*.6)*c[2]*(1+.1*S.up.c);if(c[3])r*=Math.max(.4,1-.12*trip.crashes);let bonus='';if(c[4]&&trip.crashes===0){r*=1.25;bonus=t('express');}
    r*=(DIFF[S.diff]||DIFF.n).r;r=Math.round(r);S.money+=r;S.km+=trip.target;S.trips++;save();
    $('ovT').textContent=t('okT');$('ovP').textContent=t('okDel',{km:trip.target.toLocaleString(S.lang),reward:r.toLocaleString(S.lang),bonus:bonus})+' 🕒 '+fmtT(trip.to.tz,trip.startMs+trip.simMs)+' '+trip.to.n+' · '+t('crashes',{n:trip.crashes});
  }else{me.fin=Math.round((performance.now()-t0))/1000+(me.pen||0);$('ovT').textContent=t('okT');$('ovP').textContent=t('okRace',{time:me.fin.toFixed(1)});}
  $('startBtn').textContent=t('again');$('ov').hidden=false;updateRouteInfo();
}
/* ---------- оновлення ---------- */
function localMs(){return trip.startMs+trip.simMs;}
function curTz(){return trip.target&&trip.km>trip.target/2?trip.to.tz:(trip.from?trip.from.tz:'UTC');}
let nightFlag=false,nightAt=0;
function isNight(){const n=performance.now();if(n-nightAt>400){nightAt=n;nightFlag=false;if(mode==='del'&&phase!=='idle'&&trip.from){const h=hourIn(curTz(),localMs());nightFlag=h>=20||h<6;}}return nightFlag;}
function update(dt){
  if(mode==='world'){updateWorld(dt);return;}
  if(shake>0)shake-=dt;
  if(phase==='count'){countT-=dt;if(countT<=0){phase='race';t0=performance.now();}return;}
  if(phase!=='race')return;
  if(!isFinite(me.fuel))me.fuel=100;if(!isFinite(me.v))me.v=0;
  raceTime=(performance.now()-t0)/1000+(me.pen||0);
  const D=DIFF[S.diff]||DIFF.n;
  wTimer+=dt;if(wTimer>40){wTimer=0;const r=Math.random();weather=r<D.s?'sun':r<D.s+(1-D.s)*.6?'rain':'snow';}
  const dif=mode==='race'?1:D.a;
  const steer=(input.right?1:0)-(input.left?1:0);
  me.x=clamp(me.x+steer*1.7*(1+.08*S.up.r)*dt,.45,2.55);
  const vm=vmax()*(turbo.t>0?1.25:1),acc=12*(1+.12*S.up.e)*dif*(mode==='del'?trip.cargo[5]:1)*(turbo.t>0?1.8:1);
  if(turbo.t>0)turbo.t-=dt;if(turbo.cd>0)turbo.cd-=dt;
  if(input.gas&&me.fuel>0&&me.crash<=0)me.v+=acc*(1-me.v/vm)*dt;else me.v-=2.5*dt;
  if(input.brake)me.v-=26*dt;
  me.v=clamp(me.v,0,vm);
  const dd=me.v*dt;me.d+=dd;
  {const pd=me.d-dd,lim=limAt(me.d),kmh=me.v*3.6;trackSpeed(dt,kmh-lim);for(const k of [Math.floor((pd-450)/700),Math.floor((me.d-450)/700)]){if(k<0)continue;const dz=k*700+450;if(pd<dz&&me.d>=dz){if(k%2===0&&kmh>limAt(dz)+8)fineNow(30+(kmh-limAt(dz))*2+spdScore()*.6,'fineSpd');else if(k%2===1&&laneLight()==='r'&&me.v>3)fineNow(120,'fineRed');}}}
  if(mode==='del'){
    const dkm=dd*S.scale/1000;trip.km+=dkm;trip.simMs+=dt*S.scale*1000;
    me.fuel=Math.max(0,me.fuel-dkm/rangeKm()*100*D.f*(turbo.t>0?1.5:1));
  }else me.fuel=Math.max(0,me.fuel-dd*.022*(turbo.t>0?1.5:1));
  if(me.crash>0)me.crash-=dt;if(me.inv>0)me.inv-=dt;
  forCars(me.d-30,me.d+30,o=>{const rel=o.d-me.d;
    if(me.inv<=0&&rel>(mode==='del'?-2.5:-6.7)&&rel<14.7&&Math.abs(o.lane+.5-me.x)<.37){me.v*=.2;me.crash=.7;me.inv=1.4;shake=.4;if(mode==='del')trip.crashes++;}});
  const f0=Math.floor((me.d-170)/220),f1=Math.ceil((me.d-130)/220);
  for(let k=f0;k<=f1;k++){const f=fuelAt(k);if(!f||collected.has(k))continue;const oy=-(f.d-me.d)*PX;
    if(oy>-70&&oy<90&&Math.abs(f.lane+.5-me.x)<.5){collected.add(k);me.fuel=Math.min(100,me.fuel+(mode==='del'?12:22));}}
  if(me.fuel<=0&&me.v<.5){dnfT+=dt;if(dnfT>2.5){if(S.money>=100&&mode==='del'){S.money-=100;me.fuel=40;dnfT=0;save();toast(t('tow'));}else finishRun(false);}}else dnfT=0;
  if(mode==='del'&&trip.km>=trip.target){trip.km=trip.target;finishRun(true);}
  else if(mode==='race'&&me.d>=RACE){me.d=RACE;finishRun(true);}
}
function syncOthers(dt){
  const seen={},a=Math.min(1,dt*12);
  if(mode==='race')for(const id in net.players){if(id===net.id)continue;const p=net.players[id];seen[id]=1;let o=others[id];if(!o)o=others[id]={rd:p.d,rx:p.x};o.rd+=(p.d-o.rd)*a;o.rx+=(p.x-o.rx)*a;o.n=p.n;o.c=p.c;o.d=p.d;o.f=p.f;}
  for(const id in others)if(!seen[id])delete others[id];
}
/* ---------- малювання ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill();}
function drawTruck(x,y,color,name,alpha){
  ctx.save();ctx.globalAlpha=alpha;

  W.traffic.forEach(c=>{if(!c.pos||!c.m.visible)return;const k=Math.min(1,dt*8),hd=Math.atan2(c.pos.tx,-c.pos.tz);if(c.vx===undefined||Math.hypot(c.vx-c.pos.x,c.vz-c.pos.z)>30){c.vx=c.pos.x;c.vz=c.pos.z;c.vh=hd;}c.vx+=(c.pos.x-c.vx)*k;c.vz+=(c.pos.z-c.vz)*k;c.vh+=wAngDiff(c.vh,hd)*k;c.m.position.set(c.vx,hAt(c.vx,c.vz),c.vz);c.m.rotation.y=-c.vh;spinWheels(c.m,c.sp*dt/.5);});
  /* анімації */
  W_.spin.forEach(s=>{s[0].rotation.z+=s[2]*dt;});W_.rock.forEach(r=>{r[0].rotation.x=Math.sin(now*1.3+r[1])*.28;});
  if(W_.flame){const k=1+Math.sin(now*14)*.15;W_.flame.scale.set(1.6*k,2.9*k,1.6*k);}
  if(W_.beam){W_.beam.rotation.y+=dt*.8;W_.beam.visible=dl<.5;}
  if(W_.plane){const T2=(now%50)/50,p=W_.plane;if(T2<.35){const k=T2/.35;p.position.set(75,2+(k>.7?(k-.7)*3*40:0),100-k*k*250);p.rotation.x=k>.7?.25:0;}else{p.position.set(75,-60,0);}}
  W.lightT=(W.lightT||0)-dt;if(W.lightT<=0){W.lightT=.4;W.lights.forEach(g=>setLight(g,wLightState(g.userData.axis)));}
  W.stars.forEach(m=>{m.rotation.y+=dt*2;m.visible=!wsd().stars.includes(m.userData.i);});
  if(wJob){W.beacon.visible=true;W.beacon.position.set(wJob.to.x,wJob.to.h+80,wJob.to.z);}else W.beacon.visible=false;
  /* дощ/сніг навколо камери */
  if(W.rain.visible){const a=W.rpos,vy=weather==='rain'?32:4;for(let i=0;i<500;i++){a[i*3+1]-=vy*dt;if(weather==='snow')a[i*3]+=Math.sin(now+i)*dt;if(a[i*3+1]<0)a[i*3+1]=25;}W.rain.position.set(W.cam.position.x,W.cam.position.y-8,W.cam.position.z);W.rain.geometry.attributes.position.needsUpdate=true;}
  rend.render(W.sc,W.cam);
  $('cnt').hidden=true;$('wbadge').textContent=(weather==='rain'?'🌧️':weather==='snow'?'❄️':'☀️')+(dl<.35?' 🌙':'')+(turbo.t>0?' ⚡':'');
  const fw=$('fwarn');fw.hidden=!(me.fuel<=0&&phase==='race');if(!fw.hidden)fw.textContent='⛽ 0%';$('offList').innerHTML='';
}
/* ---- HUD світу ---- */
function wHud(){
  $('v1').textContent=Math.round(Math.abs(wFoot?wf.v:wp.v)*3.6);const hh=Math.floor(wClock),mm=Math.floor((wClock-hh)*60);$('v3').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');$('v4').textContent=S.money.toLocaleString(S.lang);
  if(wJob){const ox=wFoot?wf.x:wp.x,oz=wFoot?wf.z:wp.z,d=Math.hypot(wJob.to.x-ox,wJob.to.z-oz);$('v2').textContent=d>=1000?(d/1000).toFixed(1)+' км':Math.round(d)+' м';const lf=Math.max(0,Math.ceil(wJob.left)),jm=Math.floor(lf/60);
    $('wJob').textContent='📦 '+t(wJob.cargo[1])+' → '+wName(wJob.to)+' · ⏱ '+jm+':'+String(lf%60).padStart(2,'0')+' · '+wJob.reward+' ₴'+(wQuest?'\n❗ '+wQText(wQuest):'');$('wJob').style.color=wJob.left>0?'#fff':'#ff9b8f';
    const ang=Math.atan2(wJob.to.x-ox,-(wJob.to.z-oz)),rel=wAngDiff(wFoot?wf.ca:wp.ca,ang);$('wArr').style.transform='rotate('+(rel*180/Math.PI-90)+'deg)';$('wArr').hidden=false;}
  else{$('v2').textContent='—';$('wJob').textContent=t('wNoJob')+(wQuest?'\n❗ '+wQText(wQuest):'');$('wJob').style.color='#fff';$('wArr').hidden=true;}
  {const rd=!wFoot&&onRoad(wp.x,wp.z),lim=rd?wLimitAt(wp.x,wp.z):null;setLim(lim,lim&&me.v*3.6>lim+8);}
  try{wMap();}catch(e){}
}
const WICON={hub:'🏭',city:'🏙️',town:'🏘️',port:'⚓',air:'✈️',farm:'🌾',ski:'⛷️',oil:'🛢️',saw:'🪵',quarry:'⛏️',wind:'🌀',light:'🗼',gas:'⛽'};
function wMap(){
  const c=$('mini'),g=c.getContext('2d'),size=wBig?280:130;if(c.width!==size){c.width=c.height=size;}
  const ax=wFoot?wf.x:wp.x,az=wFoot?wf.z:wp.z,span=wBig?2400:700,cx=wBig?0:ax,cz=wBig?0:az,mx=x=>((x-cx)/span+.5)*size,mz=z=>((z-cz)/span+.5)*size,sd=wsd();
  g.fillStyle='#10202e';g.fillRect(0,0,size,size);
  if(WORLD.mm){const n=WN+1,k=n/2400,sx=(cx-span/2+WR)*k,sz=(cz-span/2+WR)*k,sw=span*k,x0=Math.max(0,sx),z0=Math.max(0,sz),x1=Math.min(n,sx+sw),z1=Math.min(n,sz+sw);
    if(x1>x0&&z1>z0)g.drawImage(WORLD.mm,x0,z0,x1-x0,z1-z0,(x0-sx)/sw*size,(z0-sz)/sw*size,(x1-x0)/sw*size,(z1-z0)/sw*size);}
  g.strokeStyle='#f1eede';g.lineWidth=wBig?1.5:2.4;WORLD.roads.forEach(r=>{g.beginPath();r.pts.forEach((p,i)=>{i?g.lineTo(mx(p.x),mz(p.z)):g.moveTo(mx(p.x),mz(p.z));});g.stroke();});
  g.textAlign='center';g.textBaseline='middle';
  STARS.forEach((s,i)=>{if(!sd.stars.includes(i)){g.fillStyle='#ffd23c';g.fillRect(mx(s[0])-2,mz(s[1])-2,4,4);}});
  LOC.forEach(l=>{const x=mx(l.x),z=mz(l.z);if(x<-10||z<-10||x>size+10||z>size+10)return;const seen=l.type==='gas'||sd.seen.includes(l.id)||l.id==='hub';
    g.font=(wBig?(l.type==='gas'?11:16):(l.type==='gas'?10:14))+'px system-ui';g.fillStyle='#fff';g.fillText(seen?WICON[l.type]:'❔',x,z);
    if(wBig&&seen&&l.type!=='gas'){g.font='bold 9px system-ui';g.lineWidth=3;g.strokeStyle='#000c';g.strokeText(wName(l),x,z+12);g.fillStyle='#fff';g.fillText(wName(l),x,z+12);}});
  if(!wBig&&!wQuest&&wFoot)WORLD.npcs.forEach(n=>{g.fillStyle='#ffd23c';g.font='bold 12px system-ui';g.fillText('!',mx(n.x),mz(n.z));});
  const ring=(x,z,col)=>{const px=clamp(mx(x),8,size-8),pz=clamp(mz(z),8,size-8);g.strokeStyle=col;g.lineWidth=2.4;g.beginPath();g.arc(px,pz,6,0,6.3);g.stroke();};
  if(wJob)ring(wJob.to.x,wJob.to.z,'#3cf0a0');if(wQuest&&wQuest.to)ring(wQuest.to.x,wQuest.to.z,'#ff9f43');
  if(!wTr.att){g.fillStyle='#b9824a';g.fillRect(mx(wTr.x)-3,mz(wTr.z)-3,6,6);}
  if(wFoot){g.fillStyle='#4da3ff';g.fillRect(mx(wp.x)-3,mz(wp.z)-3,6,6);}
  g.save();g.translate(mx(ax),mz(az));g.rotate(wFoot?wf.a:wp.a);g.fillStyle='#ff4d4d';g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.moveTo(0,-7);g.lineTo(5,6);g.lineTo(-5,6);g.closePath();g.fill();g.stroke();g.restore();
}
$('mini').addEventListener('click',()=>{wBig=!wBig;$('mini').classList.toggle('big',wBig);});
$('wGarBtn').onclick=()=>{renderGarage();$('mGar').hidden=false;};

$('wExit').addEventListener('pointerdown',e=>{e.preventDefault();wToggleFoot();});
window.addEventListener('keydown',e=>{if((e.key==='f'||e.key==='F')&&mode==='world'&&document.activeElement.tagName!=='INPUT')wToggleFoot();});

/* джойстик і огляд на телефоні */
(function(){const j=$('joy'),k=$('joyK');
  const setV=e=>{const r=j.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2;let dx=(e.clientX-cx)/R,dy=(e.clientY-cy)/R;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}wJoy.x=dx;wJoy.y=dy;k.style.transform='translate('+dx*34+'px,'+dy*34+'px)';};
  j.addEventListener('pointerdown',e=>{e.preventDefault();wJoy.on=true;wJoy.id=e.pointerId;try{j.setPointerCapture(e.pointerId);}catch(x){}setV(e);});
  j.addEventListener('pointermove',e=>{if(wJoy.on&&e.pointerId===wJoy.id){e.preventDefault();setV(e);}});
  const end=e=>{if(e.pointerId!==wJoy.id)return;wJoy.on=false;wJoy.x=wJoy.y=0;k.style.transform='none';};
  ['pointerup','pointercancel'].forEach(ev=>j.addEventListener(ev,end));
  let lid=null,lx=0;
  cv.addEventListener('pointerdown',e=>{if(!wFoot||mode!=='world')return;const r=cv.getBoundingClientRect();if(e.clientX<r.left+r.width*.4)return;lid=e.pointerId;lx=e.clientX;});
  cv.addEventListener('pointermove',e=>{if(e.pointerId!==lid)return;wf.ca+=(e.clientX-lx)*.009;wf.hold=2.5;lx=e.clientX;});
  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>{if(e.pointerId===lid)lid=null;}));
})();

/* від себе: клаксон 📣 (кнопка або H) */
let wAC=null;
function wHorn(){
  if(mode!=='world'||phase!=='race')return;
  try{wAC=wAC||new (window.AudioContext||window.webkitAudioContext)();const a=wAC,t0=a.currentTime;
    [311,392].forEach(f=>{const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.18,t0+.03);g.gain.setValueAtTime(.18,t0+.45);g.gain.exponentialRampToValueAtTime(.0001,t0+.7);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+.75);});}catch(e){}
  if(WORLD){const ax=wFoot?wf.x:wp.x,az=wFoot?wf.z:wp.z;WORLD.traffic.forEach(c=>{if(c.pos&&Math.hypot(c.pos.x-ax,c.pos.z-az)<40)c.sp=c.sp+9;});}
}
$('wHorn').addEventListener('pointerdown',e=>{e.preventDefault();wHorn();});
window.addEventListener('keydown',e=>{if((e.key==='h'||e.key==='H')&&document.activeElement.tagName!=='INPUT')wHorn();});

/* ---------- таблиця і HUD ---------- */
function standings(){const list=[{n:me.name||'Driver',d:me.d,f:me.fin,me:true}];for(const id in net.players){if(id===net.id)continue;const p=net.players[id];list.push({n:p.n,d:p.d,f:p.f,me:false});}
  list.sort((a,b)=>{if(a.f!=null&&b.f!=null)return a.f-b.f;if(a.f!=null)return -1;if(b.f!=null)return 1;return b.d-a.d;});return list;}
function updateHud(){
  if(mode==='world'){$('bT').textContent=turbo.cd>0?'⚡ '+Math.ceil(turbo.cd):'⚡ TURBO';$('fuelBar').style.width=clamp(me.fuel,0,100)+'%';$('fuelBar').style.background=me.fuel<20?'#d94b3b':'#e6a23c';if(phase==='race')wHud();else{$('v1').textContent=0;$('v4').textContent=S.money.toLocaleString(S.lang);}return;}
  $('v1').textContent=Math.round(me.v*3.6);setLim(phase==='race'?limAt(me.d):null,phase==='race'&&me.v*3.6>limAt(me.d)+8);
  $('bT').textContent=turbo.cd>0?'⚡ '+Math.ceil(turbo.cd):'⚡ TURBO';
  $('fuelBar').style.width=clamp(me.fuel,0,100)+'%';$('fuelBar').style.background=me.fuel<20?'#d94b3b':'#e6a23c';
  if(mode==='del'){
    $('v2').textContent=trip.target?Math.max(0,Math.ceil(trip.target-trip.km)).toLocaleString(S.lang):'—';
    $('v3').textContent=trip.from&&phase!=='idle'?fmtT(curTz(),localMs()):fmtT(curCities()[0].tz,Date.now());
    $('v4').textContent=S.money.toLocaleString(S.lang);
  }else{
    $('v2').textContent=Math.round(me.d);const s=standings();$('v3').textContent=(s.findIndex(r=>r.me)+1)+'/'+s.length;
    $('v4').textContent=(phase==='race'?raceTime:(me.fin||0)).toFixed(1);
    $('lb').innerHTML=s.slice(0,10).map((r,i)=>'<div class="'+(r.me?'me':'')+'"><span>'+(i+1)+'. '+clean(r.n,14)+(r.me?' ('+t('you')+')':'')+'</span><span>'+(r.f!=null?r.f.toFixed(1)+' s 🏁':Math.round(r.d)+' '+t('mU'))+'</span></div>').join('');
  }
}
setInterval(updateHud,150);
/* ---------- керування ---------- */
function hold(id,key){const b=$(id),on=e=>{e.preventDefault();input[key]=true;b.classList.add('on');},off=e=>{e.preventDefault();input[key]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off));b.addEventListener('contextmenu',e=>e.preventDefault());}
function useTurbo(){if(phase!=='race'||turbo.cd>0||me.fuel<6)return;turbo.t=4;turbo.cd=14;me.fuel-=3;}
$('bT').addEventListener('pointerdown',e=>{e.preventDefault();useTurbo();});
$('bC').addEventListener('pointerdown',e=>{e.preventDefault();camMode=(camMode+1)%3;});
hold('bL','left');hold('bR','right');hold('bB','brake');hold('bG','gas');
const keyMap={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'gas',w:'gas',W:'gas',ArrowDown:'brake',s:'brake',S:'brake',' ':'gas'};
window.addEventListener('keydown',e=>{if(e.key==='e'||e.key==='E'||e.key==='Shift')useTurbo();if(e.key==='c'||e.key==='C')camMode=(camMode+1)%3;const k=keyMap[e.key];if(k&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT'){input[k]=true;e.preventDefault();}});
window.addEventListener('keyup',e=>{const k=keyMap[e.key];if(k)input[k]=false;});
function loop(now){requestAnimationFrame(loop);try{const dt=lastFrame?Math.min((now-lastFrame)/1000,.05):0;lastFrame=now;frameDt=dt||.016;update(dt);syncOthers(dt);draw();}catch(e){try{console.error(e);}catch(x){}}}
if(use3d){try{init3d();}catch(e){use3d=false;try{console.error(e);}catch(x){}try{ctx=cv.getContext('2d');}catch(x){}}}
renderAcc();$('name').addEventListener('input',()=>{S.name=clean($('name').value,14);save();});
applyI18n();setMode('del');requestAnimationFrame(loop);
try{const r=JSON.parse(localStorage.getItem(NET_KEY)||'null');if(r&&r.code&&Date.now()-r.ts<15*60000&&cloudOn()){setMode('race');$('room').value=r.code;netEnter(r.code,'resume');}}catch(e){}
})();
