const net={on:false,host:false,peer:null,conns:[],hostConn:null,id:null,players:{},timer:null,wait:null,code:''};
function netStatus(s){$('netStatus').textContent=s;}
function payload(){return{n:me.name,d:Math.round(me.d*10)/10,x:Math.round(me.x*100)/100,c:me.color,f:me.fin};}
function sane(d){return{n:clean(d.n,14)||'?',d:Number(d.d)||0,x:clamp(Number(d.x)||1.5,0,3),c:/^#[0-9a-f]{6}$/i.test(d.c)?d.c:'#e6a23c',f:d.f==null?null:Number(d.f),ts:Date.now()};}
function netOffline(msg){
  if(net.timer)clearInterval(net.timer);if(net.wait)clearTimeout(net.wait);
  try{if(net.peer)net.peer.destroy();}catch(e){}
  Object.assign(net,{on:false,host:false,peer:null,conns:[],hostConn:null,players:{},timer:null,wait:null,code:''});
  $('codeBox').hidden=true;$('leaveRow').hidden=true;$('createBtn').disabled=false;$('joinBtn').disabled=false;netStatus(msg||'');
}
function netReady(){
  net.on=true;if(net.wait){clearTimeout(net.wait);net.wait=null;}
  $('codeTxt').textContent=net.code;$('codeBox').hidden=false;$('leaveRow').hidden=false;$('createBtn').disabled=true;$('joinBtn').disabled=true;
  netStatus(t('rIn',{code:net.code}));net.timer=setInterval(netTick,100);
}
function netTick(){
  if(net.host){net.players[net.id]=Object.assign(payload(),{ts:Date.now()});const now=Date.now();for(const id in net.players)if(now-net.players[id].ts>5000)delete net.players[id];const m={t:'p',p:net.players};net.conns.forEach(c=>{if(c.open)c.send(m);});}
  else if(net.hostConn&&net.hostConn.open)net.hostConn.send(Object.assign({t:'s'},payload()));
}
function hostGo(){const s=Math.floor(Math.random()*2147483647);beginCountdown(s);net.conns.forEach(c=>{if(c.open)c.send({t:'go',s});});}
function needPeer(){if(typeof Peer==='undefined'){netStatus(t('rOff'));return false;}return true;}
function randCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function netCreate(tries){
  if(!needPeer())return;net.code=randCode();netStatus(t('rConn'));
  net.wait=setTimeout(()=>netOffline(t('rFail')),12000);
  const p=new Peer('trkr2-'+net.code.toLowerCase());net.peer=p;
  p.on('open',id=>{net.host=true;net.id=id;
    p.on('connection',c=>{c.on('open',()=>{net.conns.push(c);});c.on('data',d=>{if(!d)return;if(d.t==='s')net.players[c.peer]=sane(d);else if(d.t==='goreq'&&phase!=='race'&&phase!=='count')hostGo();});c.on('close',()=>{net.conns=net.conns.filter(x=>x!==c);delete net.players[c.peer];});});
    netReady();});
  p.on('error',e=>{if(e.type==='unavailable-id'&&!net.on&&(tries||0)<4){try{p.destroy();}catch(x){}clearTimeout(net.wait);netCreate((tries||0)+1);}else netOffline(t(net.on?'rLost':'rFail'));});
}
function netJoin(code){
  if(!needPeer())return;net.code=code;netStatus(t('rConn'));net.wait=setTimeout(()=>netOffline(t('rFail')),12000);
  const p=new Peer();net.peer=p;
  p.on('open',id=>{net.id=id;const c=p.connect('trkr2-'+code.toLowerCase(),{reliable:true});net.hostConn=c;
    c.on('open',()=>netReady());
    c.on('data',d=>{if(!d)return;if(d.t==='p'&&d.p&&typeof d.p==='object'){const o={};for(const k in d.p)o[k]=sane(d.p[k]);net.players=o;}else if(d.t==='go')beginCountdown(Number(d.s)|0);});
    c.on('close',()=>netOffline(t('rLost')));});
  p.on('error',e=>netOffline(t(e.type==='peer-unavailable'?'rNotFound':'rFail')));
}
$('createBtn').onclick=()=>netCreate(0);

  me.d=0;me.x=1.5;me.v=0;me.crash=0;me.inv=0;me.fin=null;dnfT=0;raceTime=0;collected.clear();weather='sun';wTimer=0;

}
function pressStart(){

function finishRun(ok){
  phase='done';me.v=0;
  if(!ok){$('ovT').textContent=t('noT');$('ovP').textContent=t('noP');}
  else if(mode==='del'){
    const c=trip.cargo;let r=(50+trip.target*.6)*c[2]*(1+.1*S.up.c);if(c[3])r*=Math.max(.4,1-.12*trip.crashes);let bonus='';if(c[4]&&trip.crashes===0){r*=1.25;bonus=t('express');}
    r=Math.round(r);S.money+=r;S.km+=trip.target;S.trips++;save();
    $('ovT').textContent=t('okT');$('ovP').textContent=t('okDel',{km:trip.target.toLocaleString(S.lang),reward:r.toLocaleString(S.lang),bonus:bonus})+' 🕒 '+fmtT(trip.to.tz,trip.startMs+trip.simMs)+' '+trip.to.n+' · '+t('crashes',{n:trip.crashes});
  }else{me.fin=Math.round((performance.now()-t0))/1000;$('ovT').textContent=t('okT');$('ovP').textContent=t('okRace',{time:me.fin.toFixed(1)});}
  $('startBtn').textContent=t('again');$('ov').hidden=false;updateRouteInfo();

/* ---------- оновлення ---------- */
function localMs(){return trip.startMs+trip.simMs;}
function curTz(){return trip.target&&trip.km>trip.target/2?trip.to.tz:(trip.from?trip.from.tz:'UTC');}
function isNight(){if(mode==='del'&&phase!=='idle'&&trip.from){const h=hourIn(curTz(),localMs());return h>=20||h<6;}return false;}
function update(dt){
  if(shake>0)shake-=dt;
  if(phase==='count'){countT-=dt;if(countT<=0){phase='race';t0=performance.now();}return;}
  if(phase!=='race')return;
  raceTime=(performance.now()-t0)/1000;
  wTimer+=dt;if(wTimer>40){wTimer=0;const r=Math.random();weather=r<.55?'sun':r<.8?'rain':'snow';}
  const dif=S.diff==='e'?1.15:S.diff==='h'?.85:1;
  const steer=(input.right?1:0)-(input.left?1:0);
  me.x=clamp(me.x+steer*1.7*(1+.08*S.up.r)*dt,.45,2.55);
  const vm=vmax(),acc=12*(1+.12*S.up.e)*dif*(mode==='del'?trip.cargo[5]:1);
  if(input.gas&&me.fuel>0&&me.crash<=0)me.v+=acc*(1-me.v/vm)*dt;else me.v-=2.5*dt;
  if(input.brake)me.v-=26*dt;
  me.v=clamp(me.v,0,vm);
  const dd=me.v*dt;me.d+=dd;
  if(mode==='del'){
    const dkm=dd*S.scale/1000;trip.km+=dkm;trip.simMs+=dt*S.scale*1000;
    me.fuel=Math.max(0,me.fuel-dkm/rangeKm()*100*(S.diff==='h'?1.3:1));
  }else me.fuel=Math.max(0,me.fuel-dd*.022);
  if(me.crash>0)me.crash-=dt;if(me.inv>0)me.inv-=dt;
  const k0=Math.floor((me.d-OB0-30)/OBS),k1=Math.ceil((me.d-OB0+30)/OBS);
  for(let k=k0;k<=k1;k++){const o=obAt(k);if(!o)continue;const oy=-(o.d-me.d)*PX;
    if(me.inv<=0&&oy>-88&&oy<40&&Math.abs(o.lane+.5-me.x)<.37){me.v*=.2;me.crash=.7;me.inv=1.4;shake=.4;if(mode==='del')trip.crashes++;}}
  const f0=Math.floor((me.d-170)/220),f1=Math.ceil((me.d-130)/220);
  for(let k=f0;k<=f1;k++){const f=fuelAt(k);if(!f||collected.has(k))continue;const oy=-(f.d-me.d)*PX;
    if(oy>-70&&oy<90&&Math.abs(f.lane+.5-me.x)<.5){collected.add(k);me.fuel=Math.min(100,me.fuel+(mode==='del'?12:22));}}
  if(me.fuel<=0&&me.v<.5){dnfT+=dt;if(dnfT>4)finishRun(false);}else dnfT=0;
  if(mode==='del'&&trip.km>=trip.target){trip.km=trip.target;finishRun(true);}
  else if(mode==='race'&&me.d>=RACE){me.d=RACE;finishRun(true);}
}
function syncOthers(dt){
  const seen={},a=Math.min(1,dt*12);
  if(mode==='race')for(const id in net.players){if(id===net.id)continue;const p=net.players[id];seen[id]=1;let o=others[id];if(!o)o=others[id]={rd:p.d,rx:p.x};o.rd+=(p.d-o.rd)*a;o.rx+=(p.x-o.rx)*a;o.n=p.n;o.c=p.c;o.d=p.d;o.f=p.f;}
  for(const id in others)if(!seen[id])delete others[id];
}
/* ---------- малювання ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill();}
function drawTruck(x,y,color,name,alpha){
  ctx.save();ctx.globalAlpha=alpha;
  ctx.fillStyle='#1a232b';[[-28,-30],[24,-30],[-28,60],[24,60],[-28,76],[24,76]].forEach(w=>ctx.fillRect(x+w[0],y+w[1],5,14));
  ctx.fillStyle='#dce3e5';rr(x-24,y-6,48,100,5);ctx.fillStyle=color;ctx.fillRect(x-24,y+28,48,8);
  ctx.fillStyle='#aab9c0';ctx.fillRect(x-20,y+44,40,3);ctx.fillRect(x-20,y+58,40,3);
  ctx.fillStyle=color;rr(x-22,y-52,44,48,8);ctx.fillStyle='#5c91a8';rr(x-16,y-44,32,14,3);
  ctx.fillStyle='#fff2b0';ctx.fillRect(x-18,y-54,8,4);ctx.fillRect(x+10,y-54,8,4);
  if(name){ctx.globalAlpha=1;ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.strokeStyle='#000a';ctx.lineWidth=3;ctx.strokeText(name,x,y-62);ctx.fillStyle='#fff';ctx.fillText(name,x,y-62);}
  ctx.restore();
}
function draw(){
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*9,(Math.random()-.5)*9);
  const off=(me.d*PX)%120;
  ctx.fillStyle=weather==='snow'?'#c9d6dc':'#4f7c4f';ctx.fillRect(-10,-10,W+20,H+20);
  ctx.fillStyle=weather==='snow'?'#bccad1':'#477547';for(let y=-120+off;y<H;y+=120)ctx.fillRect(-10,y,W+20,60);
  ctx.fillStyle='#4a545e';ctx.fillRect(RL,-10,LANE*3,H+20);
  ctx.fillStyle='#e8e5d5';ctx.fillRect(RL-4,-10,4,H+20);ctx.fillRect(RL+LANE*3,-10,4,H+20);
  ctx.fillStyle='#f5e6a5';for(let l=1;l<3;l++)for(let y=-80+(me.d*PX)%80;y<H;y+=80)ctx.fillRect(RL+l*LANE-3,y,6,44);
  const minD=me.d-(H+80-PY)/PX,maxD=me.d+(PY+80)/PX;
  for(let k=Math.floor(minD/25);k<=Math.ceil(maxD/25);k++){if(k<0)continue;const y=PY-(k*25-me.d)*PX,left=hash(seed,k+400000)<.5,x=left?14+hash(seed,k+500000)*34:W-14-hash(seed,k+500000)*34;
    ctx.fillStyle='#2f5f3a';ctx.beginPath();ctx.arc(x,y,15,0,7);ctx.fill();ctx.fillStyle='#3d7a4a';ctx.beginPath();ctx.arc(x-3,y-3,9,0,7);ctx.fill();}
  if(mode==='race'){const fy=PY-(RACE-me.d)*PX;if(fy>-30&&fy<H+30)for(let i=0;i<18;i++){ctx.fillStyle=i%2?'#111':'#fff';ctx.fillRect(RL+i*20,fy-10,20,10);ctx.fillStyle=i%2?'#fff':'#111';ctx.fillRect(RL+i*20,fy,20,10);}}
  for(let k=Math.floor((minD-OB0)/OBS);k<=Math.ceil((maxD-OB0)/OBS);k++){const o=obAt(k);if(!o)continue;const y=PY-(o.d-me.d)*PX,x=RL+(o.lane+.5)*LANE;
    if(o.type===3){ctx.fillStyle='#fff';ctx.fillRect(x-46,y-10,92,20);ctx.fillStyle='#e8742c';for(let i=0;i<5;i++)ctx.fillRect(x-46+i*20,y-10,10,20);}
    else{ctx.fillStyle=carColors[o.type];rr(x-20,y-36,40,72,8);ctx.fillStyle='#9fd0e0';ctx.fillRect(x-14,y-20,28,14);ctx.fillRect(x-14,y+10,28,9);}}
  for(let k=Math.floor((minD-150)/220);k<=Math.ceil((maxD-150)/220);k++){const f=fuelAt(k);if(!f||collected.has(k))continue;const y=PY-(f.d-me.d)*PX,x=RL+(f.lane+.5)*LANE;
    ctx.fillStyle='#d94b3b';rr(x-15,y-17,30,34,6);ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText('⛽',x,y+7);}
  let up=0,down=0;
  for(const id in others){const o=others[id],y=PY-(o.rd-me.d)*PX,x=RL+o.rx*LANE;
    if(y>-130&&y<H+60)drawTruck(x,y,o.c,o.n,.9);
    else{ctx.font='bold 12px system-ui';ctx.textAlign='center';const dist=Math.round(o.rd-me.d),txt=(dist>0?'▲ ':'▼ ')+o.n+' '+(dist>0?'+':'')+dist+' '+t('mU'),yy=dist>0?18+up++*16:H-10-down++*16;ctx.strokeStyle='#000b';ctx.lineWidth=3;ctx.strokeText(txt,W/2,yy);ctx.fillStyle='#fff';ctx.fillText(txt,W/2,yy);}}
  const blink=me.inv>0&&Math.floor(me.inv*10)%2===0;drawTruck(RL+me.x*LANE,PY,me.color,'',blink?.45:1);
  if(weather!=='sun'){ctx.globalAlpha=.5;ctx.strokeStyle='#d8f0ff';ctx.fillStyle='#fff';ctx.lineWidth=2;for(let i=0;i<80;i++){const x=(i*83+me.d*PX*.2)%(W+20),y=(i*47+me.d*PX*.9+performance.now()*.2)%H;if(weather==='rain'){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-6,y+16);ctx.stroke();}else{ctx.beginPath();ctx.arc(x,y,2.2,0,7);ctx.fill();}}ctx.globalAlpha=1;ctx.fillStyle=weather==='rain'?'#1d3a5a22':'#ffffff22';ctx.fillRect(0,0,W,H);}
  if(isNight()){ctx.fillStyle='rgba(5,13,35,.62)';ctx.fillRect(0,0,W,H);const x=RL+me.x*LANE,b=ctx.createLinearGradient(0,PY-60,0,PY-300);b.addColorStop(0,'rgba(255,240,170,.45)');b.addColorStop(1,'rgba(255,240,170,0)');ctx.fillStyle=b;ctx.beginPath();ctx.moveTo(x-16,PY-54);ctx.lineTo(x+16,PY-54);ctx.lineTo(x+85,PY-300);ctx.lineTo(x-85,PY-300);ctx.fill();}
  ctx.font='bold 13px system-ui';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.strokeStyle='#000a';ctx.lineWidth=3;
  const wl=(weather==='rain'?'🌧️ ':weather==='snow'?'❄️ ':'☀️ ')+(isNight()?'🌙':'');ctx.strokeText(wl,10,22);ctx.fillText(wl,10,22);
  if(me.fuel<=0&&phase==='race'){ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeText('⛽ 0%',W/2,320);ctx.fillText('⛽ 0%',W/2,320);}
  if(phase==='count'){const n=Math.ceil(countT-.5),s=n>0?String(n):'GO!';ctx.font='bold 84px system-ui';ctx.textAlign='center';ctx.strokeStyle='#000c';ctx.lineWidth=8;ctx.strokeText(s,W/2,300);ctx.fillStyle='#ffd27a';ctx.fillText(s,W/2,300);}
  ctx.restore();
}
/* ---------- таблиця і HUD ---------- */
function standings(){const list=[{n:me.name||'Driver',d:me.d,f:me.fin,me:true}];for(const id in net.players){if(id===net.id)continue;const p=net.players[id];list.push({n:p.n,d:p.d,f:p.f,me:false});}
  list.sort((a,b)=>{if(a.f!=null&&b.f!=null)return a.f-b.f;if(a.f!=null)return -1;if(b.f!=null)return 1;return b.d-a.d;});return list;}
function updateHud(){
  $('v1').textContent=Math.round(me.v*3.6);
  $('fuelBar').style.width=clamp(me.fuel,0,100)+'%';$('fuelBar').style.background=me.fuel<20?'#d94b3b':'#e6a23c';
  if(mode==='del'){
    $('v2').textContent=trip.target?Math.max(0,Math.ceil(trip.target-trip.km)).toLocaleString(S.lang):'—';
    $('v3').textContent=trip.from&&phase!=='idle'?fmtT(curTz(),localMs()):fmtT(curCities()[0].tz,Date.now());
    $('v4').textContent=S.money.toLocaleString(S.lang);
  }else{
    $('v2').textContent=Math.round(me.d);const s=standings();$('v3').textContent=(s.findIndex(r=>r.me)+1)+'/'+s.length;
    $('v4').textContent=(phase==='race'?raceTime:(me.fin||0)).toFixed(1);
    $('lb').innerHTML=s.slice(0,10).map((r,i)=>'<div class="'+(r.me?'me':'')+'"><span>'+(i+1)+'. '+clean(r.n,14)+(r.me?' ('+t('you')+')':'')+'</span><span>'+(r.f!=null?r.f.toFixed(1)+' s 🏁':Math.round(r.d)+' '+t('mU'))+'</span></div>').join('');
  }
}
setInterval(updateHud,150);
/* ---------- керування ---------- */
function hold(id,key){const b=$(id),on=e=>{e.preventDefault();input[key]=true;b.classList.add('on');},off=e=>{e.preventDefault();input[key]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off));b.addEventListener('contextmenu',e=>e.preventDefault());}
hold('bL','left');hold('bR','right');hold('bB','brake');hold('bG','gas');
const keyMap={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'gas',w:'gas',W:'gas',ArrowDown:'brake',s:'brake',S:'brake',' ':'gas'};
window.addEventListener('keydown',e=>{const k=keyMap[e.key];if(k&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT'){input[k]=true;e.preventDefault();}});
window.addEventListener('keyup',e=>{const k=keyMap[e.key];if(k)input[k]=false;});
function loop(now){const dt=lastFrame?Math.min((now-lastFrame)/1000,.05):0;lastFrame=now;update(dt);syncOthers(dt);draw();requestAnimationFrame(loop);}
applyI18n();setMode('del');requestAnimationFrame(loop);
})();
</script>
